<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
@page{size:297mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:#fff}
.page{width:297mm;height:210mm;display:flex;align-items:center;justify-content:center}
.sign{width:281mm;height:196mm;border-radius:6mm;overflow:hidden;display:flex;flex-direction:row-reverse;box-shadow:0 0 0 .3mm #cfcfcf}
.photo{width:44%;position:relative;background:url(photo.jpg) center 40%/cover}
.photo:after{content:"";position:absolute;inset:0;box-shadow:inset -3mm 0 0 #C8F04B}
.credit{position:absolute;bottom:2mm;left:3mm;font:600 6pt Arial,sans-serif;color:rgba(255,255,255,.85);direction:ltr;text-shadow:0 0 2px rgba(0,0,0,.6)}
.panel{flex:1;position:relative;background:url(paper.jpg) center/cover;display:flex;flex-direction:column;align-items:center;padding:0 10mm}.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding-top:2mm}
.art{position:absolute;width:62mm;opacity:.16}
.art.a{top:-6mm;left:-8mm;transform:rotate(180deg)}
.art.b{bottom:16mm;right:-14mm;width:52mm}
.logo{height:96mm;display:block;position:relative;z-index:1}
.h{font-weight:900;font-size:36pt;color:#0B3D18;line-height:1.1;margin-top:3mm;text-align:center;position:relative}
.h2{font-weight:900;font-size:23pt;color:#D7263D;line-height:1.2;text-align:center}
.rule{width:38mm;height:1mm;background:#229E37;border-radius:1mm;margin:2.5mm 0 3mm}
.ids{display:flex;gap:7mm;width:100%;padding:0 6mm;position:relative}
.f{flex:1;display:flex;align-items:flex-end;gap:2mm;font-weight:800;font-size:14.5pt;color:#0B3D18;height:10mm}
.f .v{flex:1;border-bottom:.5mm solid #0B3D18;height:7mm;opacity:.6}
.foot{margin-top:auto;width:calc(100% + 20mm);background:#0B3D18;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:2.5mm 8mm;font-weight:700;font-size:10pt}
.foot .qr{display:flex;align-items:center;gap:2mm;font-size:9pt;line-height:1.15}
.foot .qr span{background:#F5F0E3;padding:1mm;border-radius:1.5mm;display:block}
.foot .qr img{width:14mm;height:14mm;display:block}
.foot .c{display:flex;flex-direction:column;gap:.5mm;text-align:right}
.foot .c b{color:#C8F04B}
</style></head><body>
<div class="page"><div class="sign">
 <div class="photo"><div class="credit">Photo: Shixart1985 / CC BY 2.0</div></div>
 <div class="panel">
  <img class="art a" src="lineart.svg"><img class="art b" src="lineart.svg">
  <div class="body"><img class="logo" src="logo_t.png" alt="Green Apple">
  <div class="h">تحدّي جرين أبل</div>
  <div class="h2">خط واحد.. والنتيجة تتكلم!</div>
  <div class="rule"></div>
  <div class="ids"><div class="f">كود العميل:<span class="v"></span></div><div class="f">تاريخ التجربة:<span class="v"></span></div></div></div>
  <div class="foot">
   <div class="c"><div><b>☎</b> <span dir="ltr">01006027361</span> – <span dir="ltr">048/2670187</span></div><div dir="ltr" style="text-align:right">www.greenappleai.com • info@greenappleai.com</div></div>
   <div class="qr"><div>امسح<br>واعرف أكتر</div><span><img src="qr.svg"></span></div>
  </div>
 </div>
</div></div></body></html>
