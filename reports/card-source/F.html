<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
@page{size:297mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:#fff}
.page{width:297mm;height:210mm;position:relative;display:flex;align-items:center;justify-content:center}
.cut{position:absolute;width:281mm;height:198mm;clip-path:polygon(24mm 0,calc(100% - 24mm) 0,100% 24mm,100% 100%,0 100%,0 24mm);background:#c9c9c9}
.sign{position:relative;width:280mm;height:197mm;clip-path:polygon(23.6mm 0,calc(100% - 23.6mm) 0,100% 23.6mm,100% 100%,0 100%,0 23.6mm);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.top{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
.side{position:absolute;top:0;bottom:0;width:66mm}
.side.r{right:0}.side.l{left:0;transform:scaleX(-1)}
.side img{width:100%;height:100%;object-fit:cover;display:block}
.tab{position:absolute;top:7mm;right:50%;transform:translateX(50%);background:#E1192F;color:#fff;font-weight:900;font-size:20pt;padding:0 11mm;height:13mm;line-height:13mm;border-radius:2mm;box-shadow:0 1mm 0 #a50e20;z-index:3;white-space:nowrap}
.logo{position:relative;z-index:2;padding-top:3mm}
.logo img{height:124mm;display:block}
.band{position:relative;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 6mm,transparent 6mm 12mm),linear-gradient(90deg,#1c8a30,#2DBE4A);color:#fff;padding:3.5mm 12mm 3mm;display:flex;align-items:center;gap:8mm}
.band:before{content:"";position:absolute;top:-3mm;left:0;right:0;height:3mm;background:#C8F04B}
.msg{flex:1}
.msg .h{font-weight:900;font-size:29pt;line-height:1.15}
.msg .h b{color:#C8F04B}
.msg .s{font-weight:700;font-size:13.5pt;opacity:.95}
.ids{width:88mm;background:#fff;border-radius:3mm;color:#0B3D18;padding:1mm 4mm 2.5mm}
.f{display:flex;align-items:flex-end;gap:2mm;font-weight:800;font-size:13pt;height:10.5mm}
.f .v{flex:1;border-bottom:.5mm dashed #8fb79a;height:7mm}
.strip{background:#0B3D18;color:#fff;font-weight:700;font-size:11pt;display:flex;justify-content:space-between;align-items:center;padding:0 12mm;height:13mm}
.strip b{color:#C8F04B;font-weight:800}
.strip span{display:flex;align-items:center;gap:2mm}
</style></head><body>
<div class="page">
 <div class="cut"></div>
 <div class="sign">
  <div class="top">
   <div class="side r"><img src="side.svg"></div><div class="side l"><img src="side.svg"></div>
   <div class="logo"><img src="logo_t.png" alt="Green Apple"></div>
  </div>
  <div class="band">
   <div class="msg">
    <div class="h">تحدّي جرين أبل: <b>خط واحد.. والنتيجة تتكلم!</b></div>
    <div class="s">جرّب على خط من أرضك، قارن بنفسك، واحكم إنت</div>
   </div>
   <div class="ids">
    <div class="f">كود العميل:<span class="v"></span></div>
    <div class="f">تاريخ التجربة:<span class="v"></span></div>
   </div>
  </div>
  <div class="strip">
   <span><b>☎</b><span dir="ltr">01006027361</span> – <span dir="ltr">048/2670187</span></span>
   <span dir="ltr">www.greenappleai.com</span>
   <span dir="ltr">info@greenappleai.com</span>
   <span>مدينة السادات – المنوفية</span>
  </div>
 </div>
</div></body></html>
